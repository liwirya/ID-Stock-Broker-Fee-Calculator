name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          JAVA_VERSION_STR="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"

          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "$JAVA_VERSION_STR" == 1.* ]]; then
            JAVA_MAJOR="$(printf '%s' "$JAVA_VERSION_STR" | cut -d'.' -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$JAVA_VERSION_STR" | cut -d'.' -f1 | sed -E 's/[^0-9].*//')"
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse the active Java major version from '${JAVA_VERSION_STR}'."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java ${JAVA_MAJOR} was detected."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare consistent debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ] && [ -s "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; using it for consistent update signing."
          elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
            base64 -d ./debug.keystore.base64 > ./debug.keystore || {
              echo "::error::Failed to decode ./debug.keystore.base64."
              exit 1
            }
            echo "Decoded persistent ./debug.keystore from ./debug.keystore.base64 for seamless in-place updates."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool executable not found in configured Java 17 installation (${KEYTOOL_BIN})."
              exit 1
            fi

            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to create temporary ./debug.keystore."
              exit 1
            fi
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::./debug.keystore does not exist or is empty."
            exit 1
          fi

          echo "Confirmed ./debug.keystore is ready for the debug build."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              FOUND_APKS="$(find app/build/outputs/apk -type f -name '*.apk' | sort || true)"
              if [ -n "$FOUND_APKS" ]; then
                printf '%s\n' "$FOUND_APKS"
              else
                echo "(none)"
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_SIZE="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ] || [[ "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid: ${SOURCE_APK}"
            exit 1
          fi

          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.1"
          fi

          APP_SLUG="kalkulator-fee-saham-bei"
          BASE_TAG="${APP_SLUG}-v${APP_VERSION}"
          RELEASE_TAG="${BASE_TAG}"
          RELEASE_TITLE="Kalkulator Fee Saham BEI (V${APP_VERSION})"

          if command -v gh >/dev/null 2>&1 && gh release view "$BASE_TAG" >/dev/null 2>&1; then
            RELEASE_TAG="${BASE_TAG}-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_TITLE="Kalkulator Fee Saham BEI (V${APP_VERSION} - Build #${GITHUB_RUN_NUMBER})"
          fi

          RELEASE_ASSET_NAME="${APP_SLUG}-v${APP_VERSION}.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset.XXXXXX")"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp -- "$SOURCE_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to copy verified APK into temporary release asset path."
            exit 1
          fi

          {
            echo "app_version=${APP_VERSION}"
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared APK release asset: ${RELEASE_ASSET_NAME} (tag: ${RELEASE_TAG}, title: ${RELEASE_TITLE})"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.prepare_asset.outputs.app_version }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_asset.outputs.release_title }}
        run: |
          set -euo pipefail

          if ! gh --version; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared APK release asset validation failed. Skipping GitHub Release creation."
            exit 1
          fi

          CHANGELOG_SECTION=""
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_SECTION="$(awk -v ver="## [V${APP_VERSION}]" '
              $0 == ver { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)"
          fi

          if [ -z "$(printf '%s' "$CHANGELOG_SECTION" | tr -d '[:space:]')" ]; then
            CHANGELOG_SECTION="Pembaruan dan perbaikan untuk Kalkulator Fee Saham BEI (V${APP_VERSION})."
          fi

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes-${GITHUB_RUN_NUMBER}.md"
          {
            echo "## Kalkulator Fee Saham BEI (V${APP_VERSION})"
            echo ""
            printf '%s\n' "$CHANGELOG_SECTION"
            echo ""
            echo "---"
            echo "### Informasi Build"
            echo "- **Versi Aplikasi:** V${APP_VERSION}"
            echo "- **Workflow Run Number:** #${GITHUB_RUN_NUMBER} (Attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **File APK:** \`${ASSET_NAME}\`"
            echo ""
            echo "> **Catatan:** Ini adalah debug APK yang dibangun otomatis oleh GitHub Actions menggunakan debug keystore proyek yang konsisten agar pembaruan versi berikutnya berjalan mulus (bukan rilis produksi Play Store)."
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_asset.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && [ -n "$RELEASE_URL" ]; then
              echo "GitHub Release published and verified successfully."
              echo "Release tag: ${RELEASE_TAG}"
              echo "Release title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK asset filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Build & Artifact Upload:** Succeeded (\`app-debug-apk\`)"
                echo "- **GitHub Release Publishing:** Succeeded"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Release creation reported success, but gh release view could not verify release '${RELEASE_TAG}'. The APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "> [!WARNING]"
                echo "> GitHub Release verification could not confirm the published release."
                echo ""
                echo "- **Build & Artifact Upload:** Succeeded (\`app-debug-apk\`)"
                echo "- **GitHub Release Publishing:** Unverified / Failed"
                echo ""
                echo "The debug APK build succeeded and the normal GitHub Actions artifact named \`app-debug-apk\` remains available for download on this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Publishing the APK to GitHub Releases failed. The debug APK build succeeded, and the GitHub Actions artifact named 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed during this workflow run."
              echo ""
              echo "- **Build & Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Publishing:** Failed"
              echo ""
              echo "The debug APK build and artifact upload completed successfully. You can still download the APK from the normal GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
